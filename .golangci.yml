version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    gosec:
      excludes:
        - G104 # unhandled errors are covered by errcheck with explicit `_ =`
    revive:
      rules:
        - name: exported
        - name: var-naming
        - name: indent-error-flow
        - name: unused-parameter
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      # Tests use httptest servers, fixed secrets and plain HTTP clients by design.
      - path: _test\.go
        linters:
          - bodyclose
          - gosec
          - noctx
          - unparam
          - errcheck
          - usestdlibvars

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/AkibUllah/go-api-gateway
