name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Test (race)
        run: go test -race -count=1 -coverprofile=coverage.out -coverpkg=./internal/... ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o bin/ ./cmd/...
      - name: Validate bundled config
        run: ./bin/gateway -config configs/gateway.yaml -check
      - name: Benchmarks (smoke)
        if: matrix.go == '1.26.x'
        run: go test -run='^$' -bench=. -benchtime=200ms -benchmem ./...

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: go-api-gateway:ci
          build-args: VERSION=${{ github.sha }}
      - name: Smoke test the image
        run: |
          docker run -d --name gw -p 8080:8080 go-api-gateway:ci /usr/local/bin/gateway-demo
          for i in $(seq 1 30); do curl -fsS localhost:8080/readyz && break; sleep 1; done
          curl -fsS localhost:8080/api/catalog/products/1
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/orders/1)" = "401"
          docker rm -f gw
